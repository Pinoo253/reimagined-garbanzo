<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADB Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="admin.js"></script></head><body class="admin-body"><main class="admin-wrap"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>ADB <b>ADMIN PANEL</b></span></a><section class="admin-card"><div id="login-view"><p class="section-kicker">SECURE ACCESS</p><h1>Welcome<br><span>back.</span></h1><p class="admin-muted">Sign in with an authorized ADB administrator account.</p><form id="login-form"><label>Email<input name="email" type="email" required placeholder="admin@email.com"></label><label>Password<input name="password" type="password" required placeholder="Your password"></label><button class="btn btn-primary">Sign in ↗</button><p id="login-status" class="admin-muted"></p></form></div><div id="panel-view" hidden><div class="admin-top"><div><p class="section-kicker">CONTENT MANAGEMENT</p><h1>Dashboard<span>.</span></h1></div><button id="logout" class="btn btn-primary">Log out</button></div><p class="admin-muted" id="admin-user"></p><div class="admin-tabs"><button data-table="projects" class="active">Projects</button><button data-table="activities">Activities</button><button data-table="gallery">Gallery</button><button data-table="categories">Categories</button><button data-table="feedback">Feedback</button></div><div class="admin-form-wrap"><h2 id="table-title">Projects</h2><form id="content-form"><input type="hidden" name="id"><label>Title<input name="title" required></label><label id="description-label">Description<textarea name="description" rows="3"></textarea></label><label id="extra-label">Creator / Location<input name="extra"></label><label id="url-label">Image / Media URL<input name="url" type="url" placeholder="https://..."></label><button class="btn btn-primary">Save item ↗</button><button type="button" id="cancel-edit" class="btn btn-light">Clear</button></form></div><div id="records" class="records"></div><p class="admin-muted" id="panel-status"></p></div></section><a class="admin-back" href="index.html">← Back to website</a></main><div class="toast" id="toast"></div><style>.admin-body{min-height:100vh;background:radial-gradient(circle at 80% 10%,#dce9ff,transparent 35%),#f7faff}.admin-wrap{max-width:1000px;margin:auto;padding:55px 24px}.admin-card{background:white;border:1px solid #e8eef8;border-radius:24px;padding:42px;margin-top:35px;box-shadow:0 25px 70px #183a7510}.admin-card h1{font:800 52px/1 Manrope;letter-spacing:-.07em;margin:18px 0}.admin-card h1 span{color:#2563eb}.admin-muted{color:#7c8aa2;font-size:12px;line-height:1.7}.admin-card label{display:block;font-size:12px;color:#52627d;margin:18px 0}.admin-card input,.admin-card textarea{display:block;width:100%;margin-top:8px;padding:13px;border:1px solid #dce5f2;border-radius:9px;outline-color:#2563eb}.admin-card form .btn{margin-top:12px}.admin-top{display:flex;justify-content:space-between;align-items:center}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e6edf7;padding:20px 0}.admin-tabs button{border:1px solid #e1e8f2;background:white;border-radius:30px;padding:10px 15px;font-size:11px;color:#65738b}.admin-tabs button.active{background:#2563eb;color:white;border-color:#2563eb}.admin-form-wrap{background:#f6f9fe;padding:22px;border-radius:15px;margin:20px 0}.admin-form-wrap h2{font:700 19px Manrope}.admin-form-wrap form{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.admin-form-wrap label:nth-child(3){grid-column:1/-1}.admin-form-wrap .btn{justify-self:start}.records{display:grid;gap:9px}.record{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid #e6edf7;border-radius:12px;gap:15px}.record b{font:700 13px Manrope}.record small{display:block;color:#8a97aa;margin-top:4px}.record button{border:0;background:#eef4ff;color:#2563eb;border-radius:20px;padding:8px 12px;margin-left:5px;font-size:10px}.admin-back{display:inline-block;margin-top:22px;font-size:12px;color:#64748b}@media(max-width:650px){.admin-card{padding:24px}.admin-card h1{font-size:42px}.admin-form-wrap form{display:block}.record{align-items:flex-start}.record button{margin-top:8px}}</style></main></body></html>
